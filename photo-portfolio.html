  <style>
    .portfolio-header {
      padding: 100px 20px 40px;
      text-align: center;
      background: var(--dark);
      color: white;
    }

    /* Filter Tabs */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: var(--dark);
    }

    .filter-btn {
      padding: 8px 24px;
      border: 2px solid white;
      background: transparent;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: white;
      color: var(--dark);
    }

    /* Masonry Grid Setup */
    .masonry-container {
      padding: 40px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .masonry-grid {
      column-count: 3;
      column-gap: 16px;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 16px;
      background: #eee;
      border-radius: var(--border-radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .masonry-item:hover {
      transform: scale(1.02);
    }

    .masonry-item.hidden {
      display: none;
    }

    .masonry-item img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Lightbox Styles */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      cursor: pointer;
      line-height: 1;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 48px;
      cursor: pointer;
      background: rgba(0,0,0,0.3);
      padding: 10px 18px;
      border-radius: 4px;
      user-select: none;
      transition: background 0.2s;
    }

    .lightbox-nav:hover { background: rgba(0,0,0,0.6); }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
    @media (max-width: 600px) { .masonry-grid { column-count: 1; } }
  </style>
</head>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" onclick="handleLightboxClick(event)">
    <span class="close-lightbox">&times;</span>
    <span class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1, event)">&#8249;</span>
    <img id="lightbox-img" src="" alt="Enlarged view">
    <span class="lightbox-nav lightbox-next" onclick="navigateLightbox(1, event)">&#8250;</span>
  </div>

  <script>
    let currentIndex = 0;
    let visibleItems = [];

    function getVisibleItems() {
      return Array.from(document.querySelectorAll('.masonry-item:not(.hidden)'));
    }

    function openLightbox(element) {
      visibleItems = getVisibleItems();
      currentIndex = visibleItems.indexOf(element);
      showImage(currentIndex);
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function showImage(index) {
      const src = visibleItems[index].querySelector('img').src;
      document.getElementById('lightbox-img').src = src;
    }

    function navigateLightbox(direction, event) {
      event.stopPropagation();
      currentIndex = (currentIndex + direction + visibleItems.length) % visibleItems.length;
      showImage(currentIndex);
    }

    function handleLightboxClick(event) {
      if (event.target === document.getElementById('lightbox') || event.target.classList.contains('close-lightbox')) {
        closeLightbox();
      }
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function filterPhotos(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.masonry-item').forEach(item => {
        if (category === 'all' || item.dataset.category === category) {
          item.classList.remove('hidden');
        } else {
          item.classList.add('hidden');
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % visibleItems.length; showImage(currentIndex); }
      if (e.key === 'ArrowLeft') { currentIndex = (currentIndex - 1 + visibleItems.length) % visibleItems.length; showImage(currentIndex); }
    });
  </script>
