<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography Portfolio | Hirsty Productions</title>
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    .portfolio-header {
      padding: 100px 20px 40px;
      text-align: center;
      background: var(--dark);
      color: white;
    }

    /* Masonry Grid Setup */
    .masonry-container {
      padding: 40px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .masonry-grid {
      column-count: 3;
      column-gap: 20px;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 20px;
      background: #eee;
      border-radius: var(--border-radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .masonry-item:hover {
      transform: scale(1.02);
    }

    .masonry-item img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Lightbox Styles */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      cursor: pointer;
    }

    @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
    @media (max-width: 600px) { .masonry-grid { column-count: 1; } }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">HIRSTY PRODUCTIONS</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="portfolio.html" class="nav-link">Portfolio</a>
      </div>
    </div>
  </nav>

  <header class="portfolio-header">
    <h1>Photography</h1>
    <p>Industrial, Sports, and Event Captures</p>
  </header>

  <div class="masonry-container">
    <div class="masonry-grid">
      <div class="masonry-item" onclick="openLightbox(this)">
        <img src="assets/img/webphotos/photo1.webp" alt="Work 1">
      </div>
      <div class="masonry-item" onclick="openLightbox(this)">
        <img src="assets/img/webphotos/photo2.webp" alt="Work 2">
      </div>
      <div class="masonry-item" onclick="openLightbox(this)">
        <img src="assets/img/webphotos/photo3.webp" alt="Work 3">
      </div>
      </div>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-lightbox">&times;</span>
    <img id="lightbox-img" src="" alt="Enlarged view">
  </div>

  <script>
    function openLightbox(element) {
      const src = element.querySelector('img').src;
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // Close on Esc key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
